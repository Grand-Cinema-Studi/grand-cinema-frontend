sonar.projectKey=Grand-Cinema-Studi_grand-cinema-frontend
sonar.organization=grand-cinema-studi

sonar.sources=src
sonar.exclusions=**/*.spec.ts
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Coverage report written by npm run test:ci
sonar.javascript.lcov.reportPaths=coverage/grand-cinema-frontend/lcov.info
# Code without logic is not counted in the coverage objective
sonar.coverage.exclusions=src/main.ts,src/app/app.config.ts,**/*.routes.ts

# The CI fails when the Quality Gate is red, so the pull request cannot be merged
sonar.qualitygate.wait=true
