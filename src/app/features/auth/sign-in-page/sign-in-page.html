<section class="mx-auto flex w-full max-w-md flex-col gap-8 px-5 py-12 md:py-20">
  <div class="flex flex-col gap-3">
    <h1 class="font-display text-5xl leading-none uppercase md:text-6xl">Connexion</h1>
    <p class="text-sm text-muted">Pour réserver vos places et retrouver vos billets.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="flex flex-col gap-5">
    <div class="flex flex-col gap-1.5">
      <label for="email" class="text-xs font-semibold uppercase">Adresse e-mail</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        class="h-11 rounded-[3px] border border-line bg-night px-3 focus:border-cream focus:outline-none"
      />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="password" class="text-xs font-semibold uppercase">Mot de passe</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        class="h-11 rounded-[3px] border border-line bg-night px-3 focus:border-cream focus:outline-none"
      />
    </div>

    @if (form.invalid && form.touched) {
      <p class="text-xs text-brand">Saisissez votre adresse e-mail et votre mot de passe.</p>
    }

    @if (error(); as message) {
      <p role="alert" class="rounded-[3px] border border-brand px-3 py-2 text-sm">{{ message }}</p>
    }

    <button
      type="submit"
      [disabled]="sending()"
      class="flex h-12.5 items-center justify-center rounded-[3px] bg-brand text-[13px] font-semibold hover:brightness-110 disabled:opacity-60"
    >
      Se connecter
    </button>
  </form>

  <p class="text-sm text-muted">
    Pas encore de compte ?
    <a
      routerLink="/sign-up"
      [queryParams]="returnUrl ? { returnUrl } : {}"
      class="text-cream underline"
      >Créer un compte</a
    >
  </p>
</section>
