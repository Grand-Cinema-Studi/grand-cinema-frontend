@let slot = screening();
@if (slot.remainingSeats > 0) {
  <a
    [routerLink]="['/movies', movieId()]"
    [queryParams]="{ screening: slot.screeningId }"
    class="flex min-h-11 flex-col items-center justify-center rounded-[3px] border border-line py-1 hover:border-cream md:min-h-9.75"
  >
    <ng-container *ngTemplateOutlet="details" />
  </a>
} @else {
  <div
    class="flex min-h-11 flex-col items-center justify-center rounded-[3px] border border-line py-1 opacity-60 md:min-h-9.75"
  >
    <ng-container *ngTemplateOutlet="details" />
  </div>
}

<ng-template #details>
  <span class="text-[10px] md:text-xs">{{ slot.startsAt | date: 'HH:mm' }}</span>
  <span class="text-[8px] text-muted md:text-[10px]">{{ slot.roomName }}</span>
  @if (slot.remainingSeats === 0) {
    <span class="text-[8px] font-semibold text-brand uppercase md:text-[10px]">Complet</span>
  } @else {
    <span class="text-[8px] text-muted md:text-[10px]"
      >{{ slot.remainingSeats }} {{ slot.remainingSeats === 1 ? 'place' : 'places' }}</span
    >
  }
</ng-template>
