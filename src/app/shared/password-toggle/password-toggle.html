<button
  type="button"
  (click)="visible.set(!visible())"
  [attr.aria-pressed]="visible()"
  [attr.aria-controls]="controls()"
  aria-label="Afficher le mot de passe"
  class="absolute inset-y-0 right-0 flex w-11 items-center justify-center rounded-[3px] opacity-70 hover:opacity-100 focus-visible:opacity-100 focus-visible:outline-2 focus-visible:outline-cream"
>
  <img [src]="visible() ? 'icons/eye-off.svg' : 'icons/eye.svg'" alt="" width="20" height="20" />
</button>
